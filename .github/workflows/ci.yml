name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - name: 使用 Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: 安装依赖（postinstall 自动执行 vendor 脚本）
        run: npm ci

      - name: 校验 vendor 产物完整性
        run: |
          test -f vendor/exifr.full.esm.mjs
          test -f vendor/c2pa.wasm.js
          test -f vendor/c2pa_bg.wasm
          node --input-type=module -e "
            import { readFileSync } from 'node:fs';
            import { createHash } from 'node:crypto';
            const glue = readFileSync('vendor/c2pa.wasm.js', 'utf8');
            const m = glue.match(/WASM_SRI\s*=\s*\"sha512-([A-Za-z0-9+/=]+)\"/);
            if (!m) { console.error('未找到 WASM_SRI'); process.exit(1); }
            const wasm = readFileSync('vendor/c2pa_bg.wasm');
            const actual = createHash('sha512').update(wasm).digest('base64');
            if (actual !== m[1]) { console.error('WASM 完整性校验失败'); process.exit(1); }
            console.log('C2PA WASM 完整性校验通过');
          "

      - name: 单元测试
        run: npm test

      - name: 语法检查
        run: |
          for f in $(find background content lib sidepanel options -name "*.js"); do
            node --check "$f" || exit 1
          done
          echo "全部 JS 文件语法检查通过"
